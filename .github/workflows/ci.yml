name: CI

on:
  push:
    branches: [main]
    paths: ["mac/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["mac/**", ".github/workflows/ci.yml"]

permissions:
  contents: read

jobs:
  mac-app:
    runs-on: macos-14
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Package app bundle
        run: ./scripts/build-app.sh
