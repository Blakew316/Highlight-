name: Mac app

on:
  push:
    branches: [main]
    paths: ["mac/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["mac/**", ".github/workflows/ci.yml"]

permissions:
  contents: read

jobs:
  mac-app:
    runs-on: macos-14
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Package universal app
        run: UNIVERSAL=1 ZIP=1 ./scripts/build-app.sh
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Highlight-mac
          path: mac/build/Highlight-mac.zip
          if-no-files-found: error

  # On main, publish the zip as a GitHub Release so it has a stable public
  # download link: /releases/latest/download/Highlight-mac.zip
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: mac-app
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Highlight-mac
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "mac-v1.0.${{ github.run_number }}" Highlight-mac.zip \
            --repo "${{ github.repository }}" \
            --title "Highlight for Mac 1.0.${{ github.run_number }}" \
            --notes "Download Highlight-mac.zip, unzip it, and move Highlight.app to Applications. The first time you open it, macOS will block it because it isn't notarized: open System Settings > Privacy & Security and click Open Anyway." \
            --latest
