name: Chrome extension

on:
  push:
    branches: [main]
    paths: ["site/**", "extension/**", "scripts/build-extension.sh", ".github/workflows/extension.yml"]
  pull_request:
    paths: ["site/**", "extension/**", "scripts/build-extension.sh", ".github/workflows/extension.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build
        run: VERSION="1.0.${{ github.run_number }}" ./scripts/build-extension.sh
      - name: Check the package
        run: |
          python3 -c "import json; m = json.load(open('build/chrome/manifest.json')); assert m['manifest_version'] == 3, m"
          node --check build/chrome/app.js
          node --check build/chrome/background.js
          ! grep -q "cdnjs.cloudflare.com" build/chrome/app.html build/chrome/app.js
          for f in vendor/pdf.min.js vendor/pdf.worker.min.js vendor/pdf-lib.min.js vendor/jszip.min.js icons/128.png; do test -s "build/chrome/$f"; done
      - uses: actions/upload-artifact@v4
        with:
          name: Highlight-chrome
          path: build/Highlight-chrome.zip
          if-no-files-found: error

  # On main, replace the "chrome-extension" release so this link always serves the newest build:
  # /releases/download/chrome-extension/Highlight-chrome.zip
  # It is never marked "latest", so the Mac app's /releases/latest link is unaffected.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Highlight-chrome
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete chrome-extension --repo "${{ github.repository }}" --cleanup-tag --yes || true
          gh release create chrome-extension Highlight-chrome.zip \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Highlight for Chrome 1.0.${{ github.run_number }}" \
            --notes "Download Highlight-chrome.zip and unzip it. In Chrome, open chrome://extensions, turn on Developer mode, click Load unpacked, and choose the unzipped folder." \
            --latest=false
