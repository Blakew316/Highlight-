<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Highlight">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fbfcfd" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191d25" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* Same base as the Claude artifact frame: keep content clear of the notch and home indicator. */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
body{margin:0;-webkit-text-size-adjust:100%}
img{max-width:100%}
</style>
</head>
<body>
<title>Highlight</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: an Apple-style document app. Frosted top bar; on desktop the tools sit in it
   and highlights live in a sidebar; on phones the tools move to a frosted bottom
   toolbar within thumb reach and highlights open as a bottom sheet. */
:root {
  --bg: #f2f2f7;            /* systemGroupedBackground */
  --desk: #e5e5ea;          /* behind the pages */
  --surface: #ffffff;
  --surface-2: #f2f2f7;
  --fill: rgba(118, 118, 128, .12);
  --fill-strong: rgba(118, 118, 128, .2);
  --ink: #1c1c1e;
  --muted: rgba(60, 60, 67, .6);
  --line: rgba(60, 60, 67, .18);
  --accent: #007aff;        /* systemBlue */
  --accent-ink: #ffffff;
  --danger: #ff3b30;
  --bar: rgba(249, 249, 249, .78);
  --hud: rgba(28, 28, 30, .92);
  --hud-ink: #ffffff;
  --page-shadow: 0 1px 2px rgba(0, 0, 0, .08), 0 4px 18px rgba(0, 0, 0, .08);
  --sheet-shadow: 0 -8px 40px rgba(0, 0, 0, .18);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", "Segoe UI", Roboto, system-ui, sans-serif;
  --font-rounded: ui-rounded, -apple-system, "SF Pro Rounded", BlinkMacSystemFont, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --toolbar-h: 0px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --desk: #0c0c0e; --surface: #1c1c1e; --surface-2: #2c2c2e;
    --fill: rgba(118, 118, 128, .24); --fill-strong: rgba(118, 118, 128, .32);
    --ink: #ffffff; --muted: rgba(235, 235, 245, .6); --line: rgba(84, 84, 88, .65);
    --accent: #0a84ff; --accent-ink: #ffffff; --danger: #ff453a;
    --bar: rgba(29, 29, 31, .78); --hud: rgba(58, 58, 60, .94);
    --page-shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 6px 24px rgba(0, 0, 0, .5);
    --sheet-shadow: 0 -8px 40px rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --desk: #0c0c0e; --surface: #1c1c1e; --surface-2: #2c2c2e;
  --fill: rgba(118, 118, 128, .24); --fill-strong: rgba(118, 118, 128, .32);
  --ink: #ffffff; --muted: rgba(235, 235, 245, .6); --line: rgba(84, 84, 88, .65);
  --accent: #0a84ff; --accent-ink: #ffffff; --danger: #ff453a;
  --bar: rgba(29, 29, 31, .78); --hud: rgba(58, 58, 60, .94);
  --page-shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 6px 24px rgba(0, 0, 0, .5);
  --sheet-shadow: 0 -8px 40px rgba(0, 0, 0, .6);
  color-scheme: dark;
}

[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--desk); color: var(--ink);
  font-family: var(--font); font-size: 15px; line-height: 1.4; letter-spacing: -.01em;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  display: flex; flex-direction: column; overflow: hidden;
}
button, input { font: inherit; color: inherit; letter-spacing: inherit; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 1px; border-radius: 8px; }
svg { display: block; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- top bar ---------- */
.bar {
  position: relative; z-index: 15;
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px;
  min-height: 52px; box-sizing: border-box;
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: .5px solid var(--line);
}
/* The frosted background sits on a pseudo-element: a backdrop-filter on the bar itself
   would trap the phone's position:fixed bottom toolbar inside the bar. */
.bar::before {
  content: ""; position: absolute; inset: 0; z-index: -1; background: var(--bar);
  -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
}
.lead { display: flex; align-items: center; }
.title { display: flex; align-items: center; gap: 10px; min-width: 0; }
.app-mark { width: 26px; height: 26px; flex: none; border-radius: 7px; overflow: hidden; }
.title .name { font-weight: 600; font-size: 15px; }
.title .file {
  color: var(--muted); font-size: 14px; min-width: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.title .file::before { content: "/"; margin-right: 10px; color: var(--line); }
.title .dirty { color: var(--muted); font-size: 12px; padding: 2px 7px; border-radius: 999px; background: var(--fill); flex: none; }
.tools { display: flex; align-items: center; gap: 4px; }
.group { display: flex; align-items: center; gap: 2px; }
.sep { width: .5px; height: 20px; background: var(--line); margin: 0 6px; }

/* Buttons: borderless like macOS/iOS toolbars; the one primary action is a filled capsule. */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 32px; min-width: 32px; padding: 0 10px; box-sizing: border-box;
  border: 0; border-radius: 8px; background: transparent; cursor: pointer;
  font-size: 14px; font-weight: 500; white-space: nowrap; text-decoration: none; color: var(--ink);
  transition: background-color .15s ease, opacity .15s ease, transform .1s ease;
  touch-action: manipulation;
}
.btn:hover { background: var(--fill); }
.btn:active { background: var(--fill-strong); }
.btn:disabled { opacity: .35; cursor: default; background: transparent; }
.btn.icon { padding: 0; width: 32px; }
.btn.tinted { color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 0 14px; font-weight: 600; }
.btn.primary:hover { background: color-mix(in srgb, var(--accent) 88%, #000); }
.btn.primary:disabled { background: var(--accent); }
.btn.filled { background: var(--fill); border-radius: 999px; padding: 0 14px; }
.btn.filled:hover { background: var(--fill-strong); }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
.zoom { font-family: var(--mono); font-size: 12px; min-width: 52px; font-variant-numeric: tabular-nums; color: var(--muted); }
.count { font-variant-numeric: tabular-nums; }
#sideCount {
  font-size: 12px; font-weight: 600; min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box;
  border-radius: 999px; background: var(--fill); display: inline-grid; place-items: center;
}

.swatches { display: flex; gap: 8px; padding: 0 6px; }
.swatch {
  width: 20px; height: 20px; border-radius: 50%; padding: 0; cursor: pointer; flex: none;
  border: 0; box-shadow: inset 0 0 0 .5px rgba(0, 0, 0, .2);
  transition: transform .12s ease;
  touch-action: manipulation;
}
.swatch:hover { transform: scale(1.12); }
.swatch[aria-checked="true"] { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent); }

/* ---------- find bar ---------- */
.findbar {
  position: relative; z-index: 14;
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--bar);
  -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  border-bottom: .5px solid var(--line);
}
.search-field { position: relative; flex: 1 1 220px; max-width: 380px; min-width: 0; }
.search-field svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--muted); pointer-events: none; }
.findbar input {
  width: 100%; height: 36px; box-sizing: border-box; padding: 0 10px 0 32px;
  border: 0; border-radius: 10px; background: var(--fill); font-size: 16px; /* 16px stops iOS zooming on focus */
  -webkit-appearance: none; appearance: none;
}
.findbar input::-webkit-search-cancel-button { -webkit-appearance: none; }
.findbar input:focus { outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent); }
.findbar .status { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 8ch; }
.findbar #findClose { color: var(--accent); font-weight: 400; }

/* ---------- main area ---------- */
.main { flex: 1; min-height: 0; display: grid; grid-template-columns: 320px minmax(0, 1fr); }
.main.no-side { grid-template-columns: minmax(0, 1fr); }
.main.no-side aside { display: none; }

aside {
  background: var(--surface); border-right: .5px solid var(--line);
  display: flex; flex-direction: column; min-height: 0;
}
.grabber { display: none; }
.side-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 16px; }
.tabs, .seg {
  display: flex; gap: 2px; padding: 2px; border-radius: 9px; background: var(--fill);
}
.tabs { flex: 1; }
.tab {
  flex: 1; border: 0; background: none; cursor: pointer; height: 28px; padding: 0 10px; border-radius: 7px;
  font-size: 13px; font-weight: 500; color: var(--ink); touch-action: manipulation;
}
.tab[aria-selected="true"] { background: var(--surface); font-weight: 600; box-shadow: 0 3px 8px rgba(0, 0, 0, .12), 0 0 0 .5px rgba(0, 0, 0, .04); }
:root[data-theme="dark"] .tab[aria-selected="true"] { background: #636366; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tab[aria-selected="true"] { background: #636366; } }
.tab .count { color: var(--muted); font-weight: 500; }
#sideClose { color: var(--muted); }

.list { list-style: none; margin: 0; padding: 0 0 8px; overflow: auto; flex: 1; min-height: 0; overscroll-behavior: contain; }
.item {
  position: relative; display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 12px; align-items: start;
  padding: 11px 12px 11px 16px; cursor: pointer;
}
.item + .item::before { content: ""; position: absolute; top: 0; left: 38px; right: 0; border-top: .5px solid var(--line); }
.item:hover, .item:focus-visible { background: var(--fill); outline: none; }
.item .bar-c { width: 10px; height: 10px; margin-top: 5px; border-radius: 50%; box-shadow: inset 0 0 0 .5px rgba(0, 0, 0, .2); }
.item .t { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; min-width: 0; font-size: 15px; }
.item .p { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
.item .x {
  border: 0; background: var(--fill); color: var(--muted); cursor: pointer; width: 22px; height: 22px; border-radius: 50%;
  display: grid; place-items: center; font-size: 13px; line-height: 1; opacity: 0; margin-top: 1px;
  touch-action: manipulation;
}
.item:hover .x, .item:focus-within .x { opacity: 1; }
.item .x:hover { background: color-mix(in srgb, var(--danger) 18%, transparent); color: var(--danger); }
.item.lib { cursor: default; }
.empty { padding: 20px 16px; color: var(--muted); font-size: 14px; }
.empty b { color: var(--ink); font-weight: 600; }
.side-foot {
  display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 16px 14px;
  border-top: .5px solid var(--line);
}
.side-foot .btn { color: var(--accent); }
.lib-settings { padding: 4px 16px 14px; display: flex; flex-direction: column; gap: 8px; border-bottom: .5px solid var(--line); }
.lib-settings .lbl { font-size: 13px; color: var(--muted); }
.lib-settings .hint { color: var(--muted); font-size: 13px; margin: 0; }
.seg { width: 100%; box-sizing: border-box; }
.seg label { position: relative; flex: 1; }
.seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.seg span { display: grid; place-items: center; height: 28px; border-radius: 7px; font-size: 13px; font-weight: 500; }
.seg input:checked + span { background: var(--surface); font-weight: 600; box-shadow: 0 3px 8px rgba(0, 0, 0, .12), 0 0 0 .5px rgba(0, 0, 0, .04); }
:root[data-theme="dark"] .seg input:checked + span { background: #636366; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .seg input:checked + span { background: #636366; } }
.seg input:focus-visible + span { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); }

#viewer { overflow: auto; position: relative; min-width: 0; touch-action: pan-x pan-y; overscroll-behavior: contain; }
#viewer:focus { outline: none; }
.pages {
  width: max-content; min-width: 100%; box-sizing: border-box;
  display: flex; flex-direction: column; align-items: center; gap: 24px;
  padding-block: 24px calc(48px + var(--toolbar-h));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.pages.pinching { transform-origin: 0 0; will-change: transform; }
.page { position: relative; background: #fff; box-shadow: var(--page-shadow); border-radius: 2px; flex: none; }
.page canvas { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 2px; }
.page .num { position: absolute; left: 50%; transform: translateX(-50%); bottom: -19px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* Banners: inline cards above the pages (sample, restore, saved passages). */
.banner {
  box-sizing: border-box; width: min(560px, calc(100vw - 32px));
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 12px; align-items: center;
  background: var(--surface); border-radius: 14px; padding: 12px 12px 12px 14px;
  box-shadow: 0 1px 2px rgba(0, 0, 0, .06);
  font-size: 14px;
}
.banner .ico { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
.banner .ico svg { width: 17px; height: 17px; }
.banner > span:not(.ico) { min-width: 0; }
.banner b { font-weight: 600; }
.banner .muted { color: var(--muted); }
.banner .actions { grid-column: 2 / -1; display: flex; flex-wrap: wrap; gap: 8px; }
.banner .btn { height: 30px; font-size: 14px; }
.banner > .btn.icon { grid-column: 3; grid-row: 1; color: var(--muted); }
.banner:not(:has(.ico)) { grid-template-columns: minmax(0, 1fr) auto; }
.banner:not(:has(.ico)) .actions { grid-column: 1 / -1; }

.hl-layer { position: absolute; inset: 0; z-index: 1; mix-blend-mode: multiply; pointer-events: none; }
.hl-rect { position: absolute; border-radius: 2px; }
.hl-rect.flash { animation: flash 1.1s ease-out; }
@keyframes flash { 0%, 40% { box-shadow: 0 0 0 3px var(--accent); } 100% { box-shadow: 0 0 0 3px transparent; } }
.find-layer { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
.find-hit { position: absolute; border-radius: 3px; box-shadow: 0 0 0 1.5px var(--accent); }
.find-hit.current { background: color-mix(in srgb, var(--accent) 22%, transparent); box-shadow: 0 0 0 2.5px var(--accent); }

/* PDF.js text layer (adapted from pdf_viewer.css 3.11) */
.textLayer {
  position: absolute; text-align: initial; inset: 0; overflow: hidden; line-height: 1; z-index: 2;
  -webkit-text-size-adjust: none; text-size-adjust: none; forced-color-adjust: none; transform-origin: 0 0;
}
.textLayer span, .textLayer br {
  color: transparent; position: absolute; white-space: pre; cursor: text; transform-origin: 0% 0%;
}
.textLayer span.markedContent { top: 0; height: 0; }
.textLayer ::selection { background: rgba(0, 122, 255, .28); }

/* ---------- selection bar (iOS edit-menu style), toast, dialog ---------- */
#pop {
  position: fixed; z-index: 30; display: flex; align-items: center; gap: 10px;
  background: var(--hud); color: var(--hud-ink); border-radius: 14px; padding: 8px 10px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, .28);
  -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
}
#pop .lbl { font-size: 13px; font-weight: 600; padding: 0 2px 0 4px; }
#pop .swatch { width: 26px; height: 26px; box-shadow: inset 0 0 0 .5px rgba(0, 0, 0, .25); }
#pop .btn { height: 28px; color: var(--hud-ink); }
#pop .btn:hover { background: rgba(255, 255, 255, .14); }
#pop .btn.danger { color: #ff6961; }

#toast {
  position: fixed; z-index: 40; left: 50%; transform: translateX(-50%);
  bottom: calc(24px + var(--toolbar-h) + env(safe-area-inset-bottom, 0px));
  background: var(--hud); color: var(--hud-ink); padding: 10px 16px; border-radius: 999px;
  max-width: min(520px, calc(100vw - 32px)); box-sizing: border-box; text-align: center;
  font-size: 14px; font-weight: 500; box-shadow: 0 10px 30px rgba(0, 0, 0, .25);
  -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
}

dialog {
  border: 0; border-radius: 14px; padding: 0; width: min(300px, calc(100vw - 48px));
  background: var(--surface); color: var(--ink); text-align: center; overflow: hidden;
  box-shadow: 0 20px 60px rgba(0, 0, 0, .3);
}
dialog::backdrop { background: rgba(0, 0, 0, .35); }
dialog h3 { margin: 20px 16px 4px; font-size: 17px; font-weight: 600; text-wrap: balance; }
dialog p { margin: 0 16px 18px; color: var(--muted); font-size: 13px; }
dialog .row { display: flex; border-top: .5px solid var(--line); }
dialog .row .btn {
  flex: 1; height: 44px; border-radius: 0; font-size: 17px; font-weight: 400; color: var(--accent); background: none;
}
dialog .row .btn + .btn { border-left: .5px solid var(--line); }
dialog .row .btn.primary { font-weight: 600; background: none; color: var(--accent); }
dialog .row .btn:hover { background: var(--fill); }

.drop-hint {
  position: fixed; inset: 12px; z-index: 50; display: grid; place-items: center; pointer-events: none;
  background: color-mix(in srgb, var(--accent) 10%, transparent); border: 2px dashed var(--accent); border-radius: 18px;
  font-size: 22px; font-weight: 600; color: var(--accent);
}
#scrim { position: fixed; inset: 0; z-index: 19; background: rgba(0, 0, 0, .3); }

/* ---------- touch screens ---------- */
.btn, .swatch, .tab, .item .x { touch-action: manipulation; }
@media (pointer: coarse) {
  .mouse-only { display: none; }
  .item .x { opacity: 1; width: 28px; height: 28px; }
  #pop { padding: 10px 12px; gap: 12px; }
  #pop .swatch { width: 34px; height: 34px; }
  #pop .btn { height: 34px; }
  .textLayer ::selection { background: rgba(0, 122, 255, .32); }
}
@media (hover: none) { .item .x { opacity: 1; } }

/* ---------- phones ---------- */
@media (max-width: 760px) {
  :root { --toolbar-h: 56px; }
  body { font-size: 16px; }
  .bar { grid-template-columns: 64px minmax(0, 1fr) 64px; min-height: 48px; padding-block: 4px; gap: 4px; }
  .title { flex-direction: column; justify-content: center; gap: 0; text-align: center; }
  .app-mark, .title .name { display: none; }
  .title .file { font-size: 17px; font-weight: 600; color: var(--ink); max-width: 100%; }
  .title .file::before { display: none; }
  .title .dirty { background: none; padding: 0; font-size: 11px; }
  .lead .btn { padding: 0 4px; font-size: 17px; font-weight: 400; height: 40px; }
  .lead .btn svg { display: none; }

  /* The tools become an iOS bottom toolbar. */
  .tools {
    position: fixed; z-index: 15; left: 0; right: 0; bottom: 0;
    justify-content: space-around; gap: 0;
    height: calc(var(--toolbar-h) + env(safe-area-inset-bottom, 0px)); box-sizing: border-box;
    padding: 4px max(8px, env(safe-area-inset-left, 0px)) env(safe-area-inset-bottom, 0px) max(8px, env(safe-area-inset-right, 0px));
    background: var(--bar);
    -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
    border-top: .5px solid var(--line);
  }
  .tools > *, .tools .group { display: contents; }
  .tools .btn { height: 48px; min-width: 48px; color: var(--accent); background: none; }
  .tools .btn svg { width: 24px; height: 24px; }
  .tools .btn.primary { width: 48px; padding: 0; border-radius: 12px; background: none; color: var(--accent); }
  .tools .btn:disabled { opacity: .3; }
  .swatch-group, .zoom-group, .sep, .hide-narrow, .txt, #modeBtn { display: none !important; }
  #sideBtn { position: relative; }
  #sideCount { position: absolute; top: 6px; right: 2px; background: var(--accent); color: var(--accent-ink); }

  .findbar { padding-block: 8px; }
  .search-field { flex-basis: 100%; max-width: none; order: -1; }
  .findbar .status { flex: 1; }

  .main, .main.no-side { grid-template-columns: minmax(0, 1fr); }
  /* Highlights open as a bottom sheet. */
  aside, .main.no-side aside {
    display: flex; position: fixed; z-index: 20; left: 0; right: 0; bottom: 0;
    height: min(78%, 640px); border: 0; border-radius: 14px 14px 0 0;
    box-shadow: var(--sheet-shadow);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    transform: translateY(105%); visibility: hidden;

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script>
(() => {
"use strict";

pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

/* Highlight colors, as 0–1 RGB. These are what get written into the PDF. */
const COLORS = {
  yellow: { name: "Yellow", rgb: [1, 0.878, 0.2] },
  green:  { name: "Green",  rgb: [0.5, 0.878, 0.4] },
  blue:   { name: "Blue",   rgb: [0.45, 0.722, 1] },
  pink:   { name: "Pink",   rgb: [1, 0.5, 0.75] },
  orange: { name: "Orange", rgb: [1, 0.66, 0.25] },
};
const COLOR_KEYS = Object.keys(COLORS);
const ALPHA = 0.5;

const S = {
  pdf: null, bytes: null, name: "", sample: false,
  scale: 1, fit: true,
  pages: [],          // {pdfPage, el, hl, text, canvas, viewport, renderedScale, rendering, textContent, hasImported}
  highlights: [],     // {id, page, rects:[[x1,y1,x2,y2]] in PDF user space, rgb, text}
  color: "yellow", auto: false,
  undo: [], redo: [], dirty: false,
};
let nextId = 1;
let openToken = 0;

const $ = (id) => document.getElementById(id);
const els = {
  pages: $("pages"), viewer: $("viewer"), list: $("list"), pop: $("pop"), toast: $("toast"),
  main: $("main"), fileName: $("fileName"), dirty: $("dirty"),
};
const isNarrow = () => matchMedia("(max-width: 760px)").matches;

/* ---------- small helpers ---------- */
const css = (rgb, a = 1) => `rgba(${rgb.map((v) => Math.round(v * 255)).join(",")},${a})`;
const num = (n) => +(+n).toFixed(3);
let toastTimer;
function toast(msg, ms = 3200) {
  els.toast.textContent = msg; els.toast.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (els.toast.hidden = true), ms);
}
function confirmDialog(title, text, okLabel) {
  const dlg = $("confirmDlg");
  $("confirmTitle").textContent = title; $("confirmText").textContent = text; $("confirmOk").textContent = okLabel;
  return new Promise((resolve) => {
    const done = (v) => { dlg.close(); $("confirmOk").onclick = $("confirmCancel").onclick = null; resolve(v); };
    $("confirmOk").onclick = () => done(true);
    $("confirmCancel").onclick = () => done(false);
    dlg.oncancel = () => resolve(false);
    dlg.showModal();
  });
}
const downloadsP = (window.claude && typeof window.claude.use === "function")
  ? window.claude.use("downloads").catch(() => null) : Promise.resolve(null);

/* ---------- opening documents ---------- */
async function openFile(file) {
  if (!file) return;
  if (!/\.pdf$/i.test(file.name) && file.type !== "application/pdf") { toast(`“${file.name}” isn’t a PDF.`); return; }
  if (S.dirty && !S.sample) {
    const ok = await confirmDialog("Discard unsaved highlights?",
      `Your highlights in “${S.name}” haven’t been downloaded yet. Opening another file will lose them.`, "Open anyway");
    if (!ok) return;
  }
  const bytes = new Uint8Array(await file.arrayBuffer());
  await openBytes(bytes, file.name, false);
}

async function openBytes(bytes, name, sample) {
  hidePop();
  let pdf, locked = false;
  try {
    const task = pdfjsLib.getDocument({ data: bytes.slice(), isEvalSupported: false });
    task.onPassword = () => { locked = true; task.destroy(); };
    pdf = await task.promise;
  } catch (e) {
    locked = locked || (e && (e.name === "PasswordException" || /password/i.test(e.message || "")));
    toast(locked ? `“${name}” is password-protected. Remove the password, then open it again.`
                 : `Couldn’t open “${name}”. The file may be damaged.`, 6000);
    return;
  }
  if (S.pdf) S.pdf.destroy();
  const token = ++openToken;
  closeFind();
  Object.assign(S, { pdf, bytes, name, sample, highlights: [], undo: [], redo: [], dirty: false, pages: [], fit: true, loaded: false });
  S.key = sample ? null : storageKey(bytes, name);

  // Show page 1 right away; every other page starts as a placeholder sized like page 1.
  const first = await pdf.getPage(1);
  if (token !== openToken) return;
  els.pages.textContent = "";
  if (sample) els.pages.appendChild(sampleBanner());
  for (let i = 0; i < pdf.numPages; i++) {
    const el = document.createElement("div"); el.className = "page"; el.dataset.index = i;
    const hl = document.createElement("div"); hl.className = "hl-layer";
    const find = document.createElement("div"); find.className = "find-layer";
    const text = document.createElement("div"); text.className = "textLayer";
    const n = document.createElement("span"); n.className = "num"; n.textContent = `${i + 1} / ${pdf.numPages}`;
    el.append(hl, find, text, n);
    els.pages.appendChild(el);
    S.pages.push({ pdfPage: i === 0 ? first : null, el, hl, find, text, canvas: null, viewport: null,
                   renderedScale: 0, rendering: false, textContent: null, hasImported: false });
  }
  els.fileName.textContent = sample ? "Sample document" : name;
  els.fileName.title = name;
  els.viewer.scrollTop = 0;
  fitWidth();
  renderSidebar(); updateUI();
  await loadPages(pdf, token);
}

/* Fetches the remaining pages and their existing highlights a few at a time, so
   big documents become usable immediately instead of after every page loads. */
async function loadPages(pdf, token) {
  const BATCH = 8;
  for (let i = 0; i < S.pages.length; i += BATCH) {
    await Promise.all(S.pages.slice(i, i + BATCH).map(async (p, k) => {
      const index = i + k;
      try {
        if (!p.pdfPage) p.pdfPage = await pdf.getPage(index + 1);
        if (token !== openToken) return;
        sizePage(p);
        await importHighlights(p, index);
        if (token === openToken) redrawPagesAndFind(p);
      } catch (e) { console.error(e); }
    }));
    if (token !== openToken) return;
    renderSidebar(); renderVisible();
  }
  S.loaded = true;
  updateUI(); renderLibrary();
  offerRestore();
  autoMatchSavedPassages(token);
}

/* Existing highlight annotations become editable highlights. */
async function importHighlights(p, index) {
  let annots = [];
  try { annots = await p.pdfPage.getAnnotations(); } catch { return; }
  for (const a of annots) {
    if (a.subtype !== "Highlight") continue;
    let rects = [];
    const q = a.quadPoints;
    if (Array.isArray(q) && q.length && Array.isArray(q[0])) {
      rects = q.map((quad) => bbox(quad.map((pt) => [pt.x, pt.y])));
    } else if (q && q.length >= 8) {
      for (let k = 0; k + 7 < q.length; k += 8) rects.push(bbox([[q[k], q[k + 1]], [q[k + 2], q[k + 3]], [q[k + 4], q[k + 5]], [q[k + 6], q[k + 7]]]));
    } else if (a.rect) {
      rects = [[a.rect[0], a.rect[1], a.rect[2], a.rect[3]]];
    }
    if (!rects.length) continue;
    const rgb = a.color && a.color.length >= 3 ? [a.color[0] / 255, a.color[1] / 255, a.color[2] / 255] : COLORS.yellow.rgb;
    const h = { id: nextId++, page: index, rects, rgb, text: "" };
    h.text = await textUnder(p, rects);
    S.highlights.push(h);
    p.hasImported = true;
  }
}
function bbox(points) {
  const xs = points.map((pt) => pt[0]), ys = points.map((pt) => pt[1]);
  return [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)];
}
async function textUnder(p, rects) {
  if (!p.textContent) p.textContent = await p.pdfPage.getTextContent();
  const out = [];
  for (const it of p.textContent.items) {
    if (!it.str || !it.transform) continue;
    const x = it.transform[4] + (it.width || 0) / 2, y = it.transform[5] + (it.height || 0) / 3;
    if (rects.some((r) => x >= r[0] - 1 && x <= r[2] + 1 && y >= r[1] - 1 && y <= r[3] + 1)) out.push(it.str);
  }
  return out.join(" ").replace(/\s+/g, " ").trim();
}

/* ---------- layout & rendering ---------- */
function fitWidth() {
  if (!S.pages.length) return;
  if (!S.pages[0].pdfPage) return;
  const base = S.pages[0].pdfPage.getViewport({ scale: 1 });
  const avail = els.viewer.clientWidth - (isNarrow() ? 24 : 56);
  S.fit = true;
  setScale(Math.max(0.4, Math.min(2.2, avail / base.width)));
}
function setScale(scale) {
  S.scale = scale;
  for (const p of S.pages) {
    sizePage(p);
    if (p.renderedScale !== scale) { p.text.textContent = ""; }
    redrawPagesAndFind(p);
  }
  $("zoomFit").textContent = `${Math.round(scale * 100)}%`;
  renderVisible();
}

/* Sizes a page box. Pages not fetched yet borrow page 1's size. */
function sizePage(p) {
  const src = p.pdfPage || S.pages[0].pdfPage;
  const vp = src.getViewport({ scale: S.scale });
  if (p.pdfPage) p.viewport = vp;
  p.el.style.width = `${Math.floor(vp.width)}px`;
  p.el.style.height = `${Math.floor(vp.height)}px`;
}

let rafPending = false;
function renderVisible() {
  if (rafPending) return;
  rafPending = true;
  requestAnimationFrame(() => {
    rafPending = false;
    const vr = els.viewer.getBoundingClientRect();
    const keep = vr.height * 4;
    for (const p of S.pages) {
      if (!p.pdfPage) continue;
      const r = p.el.getBoundingClientRect();
      if (r.bottom > vr.top - 900 && r.top < vr.bottom + 900) {
        if (p.renderedScale !== S.scale) renderPage(p);
      } else if (p.canvas && !p.rendering && (r.bottom < vr.top - keep || r.top > vr.bottom + keep)) {
        // Far off screen: free the bitmap (the biggest memory cost); it is redrawn on the way back.
        p.canvas.width = 0; p.canvas.remove(); p.canvas = null;
        p.text.textContent = ""; p.renderedScale = 0;
      }
    }
  });
}

async function renderPage(p) {
  if (p.rendering) return;
  p.rendering = true;
  const scale = S.scale;
  const vp = p.pdfPage.getViewport({ scale });
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const canvas = document.createElement("canvas");
  canvas.width = Math.floor(vp.width * dpr);
  canvas.height = Math.floor(vp.height * dpr);
  try {
    await p.pdfPage.render({
      canvasContext: canvas.getContext("2d"), viewport: vp,
      transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null,
      // Pages with highlights we manage are drawn without their stored annotations, so they don't double up.
      annotationMode: p.hasImported ? pdfjsLib.AnnotationMode.DISABLE : pdfjsLib.AnnotationMode.ENABLE,
    }).promise;
    if (scale === S.scale) {
      if (p.canvas) p.canvas.remove();
      p.el.prepend(canvas); p.canvas = canvas;
      if (!p.textContent) p.textContent = await p.pdfPage.getTextContent();
      p.text.textContent = "";
      p.text.style.setProperty("--scale-factor", scale);
      await pdfjsLib.renderTextLayer({ textContentSource: p.textContent, container: p.text, viewport: vp, textDivs: [] }).promise;
      p.renderedScale = scale;
    }
  } catch (e) {
    console.error(e);
  } finally {
    p.rendering = false;
  }
  if (p.renderedScale !== S.scale) renderVisible();
}

function drawHighlights(p) {
  const index = S.pages.indexOf(p);
  p.hl.textContent = "";
  if (!p.viewport) return;
  for (const h of S.highlights) {
    if (h.page !== index) continue;
    for (const r of h.rects) {
      const v = p.viewport.convertToViewportRectangle(r);
      const div = document.createElement("div");
      div.className = "hl-rect"; div.dataset.id = h.id;
      Object.assign(div.style, {
        left: `${Math.min(v[0], v[2])}px`, top: `${Math.min(v[1], v[3])}px`,
        width: `${Math.abs(v[2] - v[0])}px`, height: `${Math.abs(v[3] - v[1])}px`,
        background: css(h.rgb, 0.55),
      });
      p.hl.appendChild(div);
    }
  }
}
function redrawPagesAndFind(p) { drawHighlights(p); drawFind(p); }
function redrawPages(indexes) { for (const i of new Set(indexes)) if (S.pages[i]) drawHighlights(S.pages[i]); }

/* ---------- selection → rectangles ---------- */
function pageAt(x, y) {
  return S.pages.find((p) => { const b = p.el.getBoundingClientRect(); return x >= b.left && x <= b.right && y >= b.top && y <= b.bottom; });
}

function currentSelectionInfo() {
  const sel = window.getSelection();
  if (!sel || sel.rangeCount === 0 || sel.isCollapsed) return null;
  const range = sel.getRangeAt(0);
  if (!els.pages.contains(range.commonAncestorContainer)) return null;
  const text = sel.toString().replace(/\s+/g, " ").trim();
  if (!text) return null;

  // Measure text nodes only. Range.getClientRects() also returns boxes of whole
  // elements inside the range, which would paint over entire pages.
  const root = range.commonAncestorContainer.nodeType === 3 ? range.commonAncestorContainer.parentNode : range.commonAncestorContainer;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const rawByPage = new Map();
  let node = range.commonAncestorContainer.nodeType === 3 ? range.commonAncestorContainer : walker.nextNode();
  while (node) {
    if (range.intersectsNode(node) && node.parentElement && node.parentElement.closest(".textLayer")) {
      const r = document.createRange();
      r.selectNodeContents(node);
      if (node === range.startContainer) r.setStart(node, range.startOffset);
      if (node === range.endContainer) r.setEnd(node, range.endOffset);
      for (const c of r.getClientRects()) {
        if (c.width < 0.5 || c.height < 0.5) continue;
        const p = pageAt(c.left + c.width / 2, c.top + c.height / 2);
        if (!p) continue;
        const b = p.el.getBoundingClientRect();
        if (!rawByPage.has(p)) rawByPage.set(p, []);
        rawByPage.get(p).push([c.left - b.left, c.top - b.top, c.right - b.left, c.bottom - b.top]);
      }
    }
    if (node === range.commonAncestorContainer) break;
    node = walker.nextNode();
  }
  const parts = [];
  for (const [p, raw] of rawByPage) {
    const rects = mergeLines(raw).map(([x1, y1, x2, y2]) => {
      const a = p.viewport.convertToPdfPoint(x1, y1), b = p.viewport.convertToPdfPoint(x2, y2);
      return [Math.min(a[0], b[0]), Math.min(a[1], b[1]), Math.max(a[0], b[0]), Math.max(a[1], b[1])].map(num);
    });
    if (rects.length) parts.push({ page: S.pages.indexOf(p), rects });
  }
  if (!parts.length) return null;
  parts.sort((a, b) => a.page - b.page);
  return { text, parts, range };
}

/* Joins word boxes on the same line into one rectangle, but keeps big gaps (columns) apart. */
function mergeLines(rects) {
  rects.sort((a, b) => a[1] - b[1] || a[0] - b[0]);
  const lines = [];
  for (const r of rects) {
    const h = r[3] - r[1];
    const line = lines.find((l) => {
      const overlap = Math.min(l[3], r[3]) - Math.max(l[1], r[1]);
      const minH = Math.min(l[3] - l[1], h);
      return overlap > minH * 0.5 && r[0] <= l[2] + minH * 1.2 && r[2] >= l[0] - minH * 1.2;
    });
    if (line) { line[0] = Math.min(line[0], r[0]); line[1] = Math.min(line[1], r[1]); line[2] = Math.max(line[2], r[2]); line[3] = Math.max(line[3], r[3]); }
    else lines.push(r.slice());
  }
  return lines;
}

/* ---------- edits (all undoable) ---------- */
function commit(action) {
  apply(action, "do");
  S.undo.push(action); S.redo = [];
  if (S.undo.length > 200) S.undo.shift();
}
function apply(action, dir) {
  const touched = [];
  if (action.type === "add" || action.type === "remove") {
    const adding = (action.type === "add") === (dir !== "undo");
    for (const h of action.items) {
      touched.push(h.page);
      if (adding) S.highlights.push(h);
      else S.highlights = S.highlights.filter((x) => x.id !== h.id);
    }
  } else if (action.type === "recolor") {
    for (const c of action.items) {
      const h = S.highlights.find((x) => x.id === c.id);
      if (h) { h.rgb = dir === "undo" ? c.from : c.to; touched.push(h.page); }
    }
  }
  S.dirty = true;
  redrawPages(touched); renderSidebar(); updateUI();
  persist();
}
function undo() { const a = S.undo.pop(); if (!a) return; apply(a, "undo"); S.redo.push(a); toast("Undone", 1200); }
function redo() { const a = S.redo.pop(); if (!a) return; apply(a, "redo"); S.undo.push(a); }

/* The selection the popover was opened for. On iPhone, tapping a popover button
   clears the text selection before the tap arrives, so the popover keeps its own copy. */
let popSelection = null;
function highlightSelection(colorKey = S.color, cached = null) {
  const info = currentSelectionInfo() || cached;
  if (!info) { toast("Select some text in the PDF first."); return false; }
  const rgb = COLORS[colorKey].rgb.slice();
  const items = info.parts.map((part) => ({ id: nextId++, page: part.page, rects: part.rects, rgb, text: info.text }));
  commit({ type: "add", items });
  rememberPassage(info.text, rgb);
  window.getSelection().removeAllRanges();
  popSelection = null;
  hidePop();
  return true;
}
function removeHighlight(id) {
  const h = S.highlights.find((x) => x.id === id);
  if (h) commit({ type: "remove", items: [h] });
  hidePop();
}
function recolorHighlight(id, key) {
  const h = S.highlights.find((x) => x.id === id);
  if (h) {
    commit({ type: "recolor", items: [{ id, from: h.rgb, to: COLORS[key].rgb.slice() }] });
    recolorPassage(h.text, COLORS[key].rgb);
  }
  hidePop();
}

/* ---------- popover ---------- */
function swatchButton(key, onPick, checked) {
  const b = document.createElement("button");
  b.className = "swatch"; b.type = "button";
  b.style.background = css(COLORS[key].rgb);
  b.setAttribute("aria-label", COLORS[key].name);
  b.title = `${COLORS[key].name} (${COLOR_KEYS.indexOf(key) + 1})`;
  if (checked !== undefined) { b.setAttribute("role", "radio"); b.setAttribute("aria-checked", String(checked)); }
  b.addEventListener("mousedown", (e) => e.preventDefault()); // keep the text selection alive
  b.addEventListener("click", () => onPick(key));
  return b;
}
const isTouch = () => matchMedia("(pointer: coarse)").matches;
function placePop(anchor, below = false) {
  const pop = els.pop;
  pop.hidden = false;
  const w = pop.offsetWidth, h = pop.offsetHeight;
  let x = anchor.left + anchor.width / 2 - w / 2;
  let y = below ? anchor.bottom + 30 : anchor.top - h - 10;
  if (below && y + h > window.innerHeight - 8) y = anchor.top - h - 54;
  if (!below && y < 8) y = anchor.bottom + 10;
  x = Math.max(8, Math.min(window.innerWidth - w - 8, x));
  y = Math.max(8, Math.min(window.innerHeight - h - 8, y));
  pop.style.left = `${x}px`; pop.style.top = `${y}px`;
}
function showSelectionPop() {
  const info = currentSelectionInfo();
  if (!info) { if (els.pop.dataset.kind === "selection") hidePop(); return; }
  const pop = els.pop;
  pop.textContent = ""; pop.dataset.kind = "selection";
  const lbl = document.createElement("span"); lbl.className = "lbl"; lbl.textContent = "Highlight";
  pop.append(lbl);
  popSelection = info;
  for (const k of COLOR_KEYS) pop.append(swatchButton(k, (key) => { setColor(key); highlightSelection(key, popSelection); }));
  const rects = info.range.getClientRects();
  // On touch screens the system's Copy menu sits above the selection, so go below it
  // (clear of the selection handle).
  placePop(rects.length ? rects[rects.length - 1] : info.range.getBoundingClientRect(), isTouch());
}
function showHighlightPop(h, anchor) {
  const pop = els.pop;
  pop.textContent = ""; pop.dataset.kind = "existing"; pop.dataset.id = h.id;
  for (const k of COLOR_KEYS) pop.append(swatchButton(k, (key) => recolorHighlight(h.id, key)));
  const del = document.createElement("button");
  del.className = "btn danger"; del.type = "button"; del.textContent = "Remove";
  del.addEventListener("click", () => removeHighlight(h.id));
  pop.append(del);
  placePop(anchor);
}
function hidePop() { els.pop.hidden = true; els.pop.dataset.kind = ""; }

/* ---------- pinch to zoom (touch) ---------- */
/* The browser's own pinch would zoom the whole app, toolbar included. Inside the
   viewer, two fingers zoom the document instead: the pages are scaled with a CSS
   transform while pinching, then re-rendered sharply at the new scale. */
function bindPinch() {
  const pts = new Map();
  let start = null;
  const dist = () => { const [a, b] = [...pts.values()]; return Math.hypot(a.x - b.x, a.y - b.y); };
  const mid = () => { const [a, b] = [...pts.values()]; return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; };
  els.viewer.addEventListener("pointerdown", (e) => {
    if (e.pointerType !== "touch" || !S.pdf) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 2) {
      const vr = els.viewer.getBoundingClientRect(), m = mid();
      start = { d: dist(), scale: S.scale, ox: m.x - vr.left + els.viewer.scrollLeft, oy: m.y - vr.top + els.viewer.scrollTop, mx: m.x - vr.left, my: m.y - vr.top, f: 1 };
      els.pages.classList.add("pinching");
      hidePop();
    }
  });
  els.viewer.addEventListener("pointermove", (e) => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (!start || pts.size < 2) return;
    const f = Math.max(0.3 / start.scale, Math.min(4 / start.scale, dist() / start.d));
    start.f = f;
    els.pages.style.transform = `translate(${start.ox}px, ${start.oy}px) scale(${f}) translate(${-start.ox}px, ${-start.oy}px)`;
  });
  const end = (e) => {
    pts.delete(e.pointerId);
    if (!start || pts.size >= 2) return;
    const { f, scale, ox, oy, mx, my } = start;
    start = null;
    els.pages.style.transform = "";
    els.pages.classList.remove("pinching");
    if (Math.abs(f - 1) < 0.03) return;
    S.fit = false;
    setScale(scale * f);
    // Keep the point between the fingers where it was.
    els.viewer.scrollLeft = ox * f - mx;
    els.viewer.scrollTop = oy * f - my;
  };
  els.viewer.addEventListener("pointerup", end);
  els.viewer.addEventListener("pointercancel", end);
}

/* ---------- sidebar ---------- */
function sortedHighlights() {
  return S.highlights.slice().sort((a, b) =>
    a.page - b.page || Math.max(...b.rects.map((r) => r[3])) - Math.max(...a.rects.map((r) => r[3])) ||
    Math.min(...a.rects.map((r) => r[0])) - Math.min(...b.rects.map((r) => r[0])));
}
function renderSidebar() {
  const list = els.list;
  list.textContent = "";
  const items = sortedHighlights();
  $("listCount").textContent = items.length ? `· ${items.length}` : "";
  $("sideCount").textContent = items.length;
  $("sideCount").hidden = !items.length;
  if (!items.length) {
    const li = document.createElement("li"); li.className = "empty";
    li.innerHTML = S.pdf
      ? "No highlights yet. Select text on a page, then pick a color. Or turn on <b>Auto-highlight</b> and every selection is highlighted right away."
      : "Open a PDF to start.";
    list.append(li);
    return;
  }
  for (const h of items) {
    const li = document.createElement("li");
    li.className = "item"; li.tabIndex = 0;
    const bar = document.createElement("span"); bar.className = "bar-c"; bar.style.background = css(h.rgb);
    const body = document.createElement("div");
    const t = document.createElement("span"); t.className = "t"; t.textContent = h.text || "(no text found)";
    const pg = document.createElement("span"); pg.className = "p"; pg.textContent = `p. ${h.page + 1}`;
    body.append(t, pg);
    const x = document.createElement("button"); x.className = "x"; x.type = "button"; x.textContent = "×";
    x.setAttribute("aria-label", "Remove highlight");
    x.addEventListener("click", (e) => { e.stopPropagation(); removeHighlight(h.id); });
    li.append(bar, body, x);
    const go = () => reveal(h);
    li.addEventListener("click", go);
    li.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
    list.append(li);
  }
}
function reveal(h) {
  const p = S.pages[h.page];
  if (!p) return;
  if (!p.viewport) { els.viewer.scrollTo({ top: p.el.offsetTop }); return; }
  const v = p.viewport.convertToViewportRectangle(h.rects[0]);
  const top = p.el.offsetTop + Math.min(v[1], v[3]) - els.viewer.clientHeight / 3;
  els.viewer.scrollTo({ top: Math.max(0, top), behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  for (const d of p.hl.querySelectorAll(`[data-id="${h.id}"]`)) { d.classList.remove("flash"); void d.offsetWidth; d.classList.add("flash"); }
  if (isNarrow()) setSide(false);
}

/* ---------- toolbar state ---------- */
function setColor(key) {
  S.color = key;
  for (const b of $("swatches").children) b.setAttribute("aria-checked", String(b.dataset.key === key));
}
function setSide(open) {
  els.main.classList.toggle("side-open", open);
  els.main.classList.toggle("no-side", !open);
  $("sideBtn").setAttribute("aria-expanded", String(open));
  $("scrim").hidden = !(open && isNarrow());
  if (!isNarrow() && S.fit) requestAnimationFrame(fitWidth);
}
function updateUI() {
  const has = !!S.pdf;
  for (const id of ["zoomIn", "zoomOut", "zoomFit", "modeBtn", "findBtn"]) $(id).disabled = !has;
  // Saving rewrites every highlight in the file, so wait until all pages' existing ones are loaded.
  $("saveBtn").disabled = !has || !S.loaded;
  $("saveBtn").title = has && !S.loaded ? "Still loading pages…" : "";
  $("undoBtn").disabled = !S.undo.length;
  $("copyBtn").disabled = $("mdBtn").disabled = !S.highlights.length;
  els.dirty.hidden = !(S.dirty && !S.sample);
}

/* ---------- saving ---------- */
async function buildPdf() {
  const { PDFDocument, PDFName, PDFString } = PDFLib;
  let doc;
  try {
    doc = await PDFDocument.load(S.bytes, { updateMetadata: false });
  } catch (e) {
    if (/encrypt/i.test(String(e && e.message))) throw new Error("This PDF is encrypted, so highlights can’t be written into it. Remove its security settings and try again.");
    throw new Error("This PDF couldn’t be re-saved. It may use features the saver doesn’t support.");
  }
  const ctx = doc.context;
  const pages = doc.getPages();
  const HL = PDFName.of("Highlight"), SUBTYPE = PDFName.of("Subtype");

  // Highlights already in the file were imported into the editor; drop them and write the current set.
  // Their popup windows (where some viewers keep comment text) go with them.
  const POPUP = PDFName.of("Popup"), PARENT = PDFName.of("Parent");
  const removed = new Set();
  for (const pg of pages) {
    const annots = pg.node.Annots();
    if (!annots) continue;
    for (let i = annots.size() - 1; i >= 0; i--) {
      const raw = annots.get(i);
      const d = ctx.lookup(raw);
      if (d && typeof d.get === "function" && d.get(SUBTYPE) === HL) { removed.add(String(raw)); annots.remove(i); }
    }
  }
  for (const pg of pages) {
    const annots = pg.node.Annots();
    if (!annots) continue;
    for (let i = annots.size() - 1; i >= 0; i--) {
      const d = ctx.lookup(annots.get(i));
      if (d && typeof d.get === "function" && d.get(SUBTYPE) === POPUP && removed.has(String(d.get(PARENT)))) annots.remove(i);
    }
  }

  for (const h of S.highlights) {
    const pg = pages[h.page];
    if (!pg || !h.rects.length) continue;
    const [r, g, b] = h.rgb.map(num);
    let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
    const quads = [], ops = [];
    for (const [a, bb, c, d] of h.rects) {
      x1 = Math.min(x1, a); y1 = Math.min(y1, bb); x2 = Math.max(x2, c); y2 = Math.max(y2, d);
      quads.push(num(a), num(d), num(c), num(d), num(a), num(bb), num(c), num(bb));
      ops.push(`${num(a)} ${num(bb)} ${num(c - a)} ${num(d - bb)} re`);
    }
    const rect = [num(x1), num(y1), num(x2), num(y2)];
    // An explicit appearance stream, so every viewer draws the highlight the same way.
    const gs = ctx.obj({ Type: "ExtGState", BM: "Multiply", ca: ALPHA, CA: ALPHA });
    const ap = ctx.stream(`q /GS0 gs ${r} ${g} ${b} rg ${ops.join(" ")} f Q`, {
      Type: "XObject", Subtype: "Form", FormType: 1, BBox: rect, Resources: { ExtGState: { GS0: gs } },
    });
    const annot = ctx.obj({
      Type: "Annot", Subtype: "Highlight", Rect: rect, QuadPoints: quads, C: [r, g, b], CA: ALPHA, F: 4,
      P: pg.ref, AP: { N: ctx.register(ap) }, M: PDFString.fromDate(new Date()),
    });
    pg.node.addAnnot(ctx.register(annot));
  }
  return doc.save();
}

async function download() {
  if (!S.pdf) return;
  const btn = $("saveBtn");
  btn.disabled = true;
  let out;
  try { out = await buildPdf(); }
  catch (e) { toast(e.message || String(e), 7000); btn.disabled = false; return; }
  const base = S.name.replace(/\.pdf$/i, "") || "document";
  const filename = `${base} (highlighted).pdf`;
  const blob = new Blob([out], { type: "application/pdf" });
  const n = S.highlights.length;
  const ok = await offerFile(filename, blob, `Downloaded “${filename}” with ${n} highlight${n === 1 ? "" : "s"}.`);
  if (ok) { S.dirty = false; clearStored(); }
  btn.disabled = false; updateUI();
}

async function copyAll() {
  const text = sortedHighlights().map((h) => `p. ${h.page + 1}: ${h.text}`).join("\n");
  try { await navigator.clipboard.writeText(text); toast("Copied the text of every highlight."); }
  catch {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.append(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch {}
    ta.remove();
    toast(ok ? "Copied the text of every highlight." : "Couldn’t reach the clipboard here.");
  }
}

/* ---------- saved passages ---------- */
/* Every passage the user highlights is remembered (text + color). Opening a PDF
   then looks for the same wording and offers to highlight it. Inside Claude the
   list lives in the viewer's private store, so it follows them across devices;
   elsewhere it lives in this browser. */
const LIB = { passages: [], mode: "ask", store: null, ready: null };
const LIB_MAX = 500;
const normText = (t) => String(t || "").replace(/\s+/g, " ").trim();

function localLibStore() {
  const K = "highlight:library:v1";
  return {
    kind: "local",
    load: async () => { try { return JSON.parse(localStorage.getItem(K) || "null"); } catch { return null; } },
    save: async (d) => { try { localStorage.setItem(K, JSON.stringify(d)); } catch {} },
  };
}
function dbLibStore(ref) {
  return {
    kind: "db",
    load: async () => { const snap = await ref.get(); return snap.exists ? snap.data() : null; },
    save: (d) => ref.set(d),
  };
}
LIB.ready = (async () => {
  let store = null;
  try {
    if (window.claude && typeof window.claude.use === "function") {
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      const id = db && user ? await user.id() : null;
      if (db && id) store = dbLibStore(db.doc(`data/users/${id}/library`));
    }
  } catch { store = null; }
  LIB.store = store || localLibStore();
  let data = null;
  try { data = await LIB.store.load(); }
  catch { LIB.store = localLibStore(); data = await LIB.store.load(); }
  if (data && Array.isArray(data.passages)) {
    LIB.passages = data.passages
      .filter((x) => x && typeof x.text === "string" && Array.isArray(x.rgb) && x.rgb.length === 3)
      .slice(0, LIB_MAX);
  }
  if (data && ["ask", "always", "off"].includes(data.mode)) LIB.mode = data.mode;
  renderLibrary();
})();

let libTimer, libSaving = false, libAgain = false;
function saveLibrary() { clearTimeout(libTimer); libTimer = setTimeout(flushLibrary, 600); }
async function flushLibrary() {
  if (!LIB.store) return;
  if (libSaving) { libAgain = true; return; }
  libSaving = true;
  const body = { passages: LIB.passages, mode: LIB.mode };
  try {
    await LIB.store.save(body);
  } catch (e) {
    // The private store refused (no write access, or full): keep the list in this browser instead.
    if (LIB.store.kind === "db") {
      LIB.store = localLibStore();
      await LIB.store.save(body);
      toast("Saved passages are being kept in this browser only.");
    }
  }
  libSaving = false;
  if (libAgain) { libAgain = false; flushLibrary(); }
}

function rememberPassage(text, rgb) {
  if (S.sample) return;
  const t = normText(text);
  if (t.length < 3) return;
  const key = t.toLowerCase();
  const existing = LIB.passages.find((x) => x.text.toLowerCase() === key);
  if (existing) existing.rgb = rgb.slice();
  else LIB.passages.unshift({ text: t, rgb: rgb.slice(), addedAt: Date.now() });
  if (LIB.passages.length > LIB_MAX) LIB.passages.length = LIB_MAX;
  saveLibrary(); renderLibrary();
}
function recolorPassage(text, rgb) {
  const key = normText(text).toLowerCase();
  const existing = LIB.passages.find((x) => x.text.toLowerCase() === key);
  if (existing) { existing.rgb = rgb.slice(); saveLibrary(); renderLibrary(); }
}

/* Page text with whitespace collapsed, plus a map from each normalized character
   back to the raw text-run string, so a match can be turned into boxes. */
function pageSearchText(p) {
  if (p.searchText) return p.searchText;
  const items = p.textContent.items;
  let str = "";
  const map = [];
  items.forEach((it, k) => {
    if (!it.str) { if (it.hasEOL) str += " "; return; }
    map.push({ k, start: str.length, len: it.str.length });
    str += it.str;
    if (it.hasEOL) str += " ";
  });
  let norm = "";
  const nmap = [];
  let space = true;
  for (let i = 0; i < str.length; i++) {
    if (/\s/.test(str[i])) { if (!space) { norm += " "; nmap.push(i); space = true; } }
    else { norm += str[i]; nmap.push(i); space = false; }
  }
  p.searchText = { str, map, lower: norm.toLowerCase(), nmap };
  return p.searchText;
}
const overlaps = (a, b) => a[0] < b[2] && b[0] < a[2] && a[1] < b[3] && b[1] < a[3];

/* Finds every saved passage in the open PDF that isn't already highlighted. */
async function findSavedPassages() {
  const found = [];
  if (!LIB.passages.length || !S.pdf) return found;
  // Longest first, so a sentence wins over a phrase inside it.
  const passages = LIB.passages.slice().sort((a, b) => b.text.length - a.text.length);
  for (let i = 0; i < S.pages.length; i++) {
    const p = S.pages[i];
    try {
      if (!p.pdfPage) p.pdfPage = await S.pdf.getPage(i + 1);
      if (!p.textContent) p.textContent = await p.pdfPage.getTextContent();
    } catch { continue; }
    const t = pageSearchText(p);
    const taken = S.highlights.filter((h) => h.page === i).flatMap((h) => h.rects);
    for (const passage of passages) {
      const q = passage.text.toLowerCase();
      let pos = t.lower.indexOf(q);
      while (pos !== -1) {
        const start = t.nmap[pos], end = t.nmap[pos + q.length - 1] + 1;
        const rects = matchRects(p.textContent.items, t.map, start, end, p.textContent.styles);
        if (rects.length && !rects.some((r) => taken.some((x) => overlaps(r, x)))) {
          found.push({ page: i, rects, rgb: passage.rgb.slice(), text: passage.text });
          taken.push(...rects);
        }
        pos = t.lower.indexOf(q, pos + q.length);
      }
    }
  }
  return found;
}
function applySavedMatches(found) {
  if (!found.length) return;
  commit({ type: "add", items: found.map((m) => ({ id: nextId++, ...m })) });
}

async function runFind(query) {
  const token = ++F.token;
  F.query = query; F.matches = []; F.index = -1;
  const q = query.trim().toLowerCase();
  for (const p of S.pages) p.find.textContent = "";
  if (q.length < 2) { $("findStatus").textContent = q ? "Keep typing" : ""; updateFindButtons(); return; }
  $("findStatus").textContent = "Searching…";
  for (let i = 0; i < S.pages.length; i++) {
    const p = S.pages[i];
    try {
      if (!p.pdfPage) p.pdfPage = await S.pdf.getPage(i + 1);
      if (!p.textContent) p.textContent = await p.pdfPage.getTextContent();
    } catch { continue; }
    if (token !== F.token) return;
    const items = p.textContent.items;
    let str = "";
    const map = [];
    items.forEach((it, k) => {
      if (!it.str) { if (it.hasEOL) str += " "; return; }
      map.push({ k, start: str.length, len: it.str.length });
      str += it.str;
      if (it.hasEOL) str += " ";
    });
    const lower = str.toLowerCase();
    let pos = lower.indexOf(q);
    while (pos !== -1) {
      const rects = matchRects(items, map, pos, pos + q.length, p.textContent.styles);
      if (rects.length) F.matches.push({ page: i, rects, text: str.substr(pos, q.length) });
      pos = lower.indexOf(q, pos + q.length);

}
/* PDF-space boxes for characters [s, e) of the page string. A text run only reports

        width: `${Math.abs(v[2] - v[0]) + 2}px`, height: `${Math.abs(v[3] - v[1]) + 2}px`,

  updateFindButtons();

  const p = S.pages[m.page];

function highlightsMarkdown() {

  put("The second pass", bold, 14); y -= 22;

  put("The third pass", bold, 14); y -= 22;
  para("The third pass is about virtually re-implementing the paper: making the same assumptions as the authors and recreating the work. Comparing your version with theirs exposes both the paper's innovations and its hidden failings. Expect it to take several hours.");

    if (mod || e.altKey) return;
    if (e.key === "Escape") { hidePop(); return; }
    if (e.key.toLowerCase() === "h" && S.pdf) { e.preventDefault(); highlightSelection(); return; }
    const n = Number(e.key);
    if (n >= 1 && n <= COLOR_KEYS.length) {
      setColor(COLOR_KEYS[n - 1]);
      if (els.pop.dataset.kind === "existing") recolorHighlight(Number(els.pop.dataset.id), COLOR_KEYS[n - 1]);
      return;
    }
    if ((e.key === "Delete" || e.key === "Backspace") && els.pop.dataset.kind === "existing") {
      e.preventDefault(); removeHighlight(Number(els.pop.dataset.id));
    }
  });

  // Drag and drop anywhere on the page.
  let dragDepth = 0;
  const hasFiles = (e) => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes("Files");
  window.addEventListener("dragenter", (e) => { if (!hasFiles(e)) return; e.preventDefault(); dragDepth++; $("dropHint").hidden = false; });
  window.addEventListener("dragover", (e) => { if (hasFiles(e)) e.preventDefault(); });
  window.addEventListener("dragleave", () => { if (--dragDepth <= 0) { dragDepth = 0; $("dropHint").hidden = true; } });
  window.addEventListener("drop", (e) => {
    if (!hasFiles(e)) return;
    e.preventDefault(); dragDepth = 0; $("dropHint").hidden = true;
    const f = Array.from(e.dataTransfer.files).find((x) => /\.pdf$/i.test(x.name) || x.type === "application/pdf");
    if (f) openFile(f); else toast("Drop a PDF file to open it.");
  });
  window.addEventListener("beforeunload", (e) => { if (S.dirty && !S.sample) { e.preventDefault(); e.returnValue = ""; } });
}

async function start() {
  bind();
  setSide(!isNarrow());
  updateUI(); renderSidebar();
  try {
    const { bytes, seeds } = await makeSample();
    await openBytes(bytes, "How to read a paper.pdf", true);
    for (const s of seeds) S.highlights.push({ id: nextId++, page: 0, rects: s.rects, rgb: COLORS[s.key].rgb.slice(), text: "" });
    const p0 = S.pages[0];
    for (const h of S.highlights) h.text = await textUnder(p0, h.rects);
    drawHighlights(p0); renderSidebar(); updateUI();
  } catch (e) {
    console.error(e);
    toast("Open a PDF to start highlighting.");
  }
}
start();
})();
</script>
